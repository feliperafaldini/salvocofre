name: salvocofre

services:
  wordpress:
    image: wordpress:latest
    ports:
      - "8080:80"
    environment:
        WORDPRESS_DB_HOST: db
        WORDPRESS_DB_USER: wp
        WORDPRESS_DB_PASSWORD: senha-local-123
        WORDPRESS_DB_NAME: wp_local
        WORDPRESS_DEBUG: "1"
        WORDPRESS_CONFIG_EXTRA: |
          define( 'WP_DEBUG_LOG', true );
          define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - ./src:/var/www/html/wp-content/plugins/salvocofre
    depends_on:
      - db

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: senha-local-root-123
      MARIADB_DATABASE: wp_local
      MARIADB_USER: wp
      MARIADB_PASSWORD: senha-local-123
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
